name: Tests
on:
  push:
  pull_request:
jobs:
  updater:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Staged updater and inbox preservation
        shell: pwsh
        run: ./tests/test_updater.ps1 -ScratchRoot $env:RUNNER_TEMP
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lupa -r epu-discord/requirements.txt
      - name: Reviewed guide catalog
        run: python tools/build_guide_catalog.py --check
      - name: Every test suite
        run: python tests/run_all.py

  helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pyinstaller>=6,<7"
      - name: Build standalone Windows helper
        shell: pwsh
        run: ./tools/build_sync_helper.ps1 -Version 0.20.1
