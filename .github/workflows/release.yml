name: Release
# Publish a release on GitHub (Releases -> Draft a new release, tag like v0.4.0)
# and this runs the tests, builds the two zips and attaches them to it.
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  updater:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Staged updater and inbox preservation
        shell: pwsh
        run: ./tests/test_updater.ps1 -ScratchRoot $env:RUNNER_TEMP
  release:
    needs: updater
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lupa "discord.py>=2.3"
      - name: Personalized guides and reviewed catalog
        run: python tools/build_guide_catalog.py --check && python tests/test_guides.py
      - name: Bank stock history and waiting requests
        run: python tests/test_bank_catalog.py
      - run: python tests/test_sync.py && python tests/test_discord.py && python tests/test_itemdb.py && python tests/test_ui.py && python tests/test_guild.py && python tests/test_autosync.py && python tests/test_bankalt.py && python tests/test_reliability.py
      - name: Discord round trip with alternate message timing
        env:
          EPU_TEST_SEED: "1"
        run: python tests/test_discord.py
      - name: Login pacing and server throttle recovery
        run: python tests/test_network.py
      - name: Request search and filter counts
        run: python tests/test_request_filters.py
      - name: Reagent bag donations
        run: python tests/test_donation_bags.py
      - name: Calendar catch-up and personal notifications
        run: python tests/test_community.py
      - name: Opt-in quest matching
        run: python tests/test_quest_matching.py
      - name: Casual guild activities and starter kits
        run: python tests/test_casual.py
      - name: Combined bank request mail
        run: python tests/test_member_mail.py
      - name: Opt-in guild location sharing and map pins
        run: python tests/test_guild_map.py
      - name: Exact request mail and attachment safeguards
        run: python tests/test_exact_mail.py
      - name: Build zips
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          sed -i "s/^## Version: .*/## Version: ${VERSION}/" EPUGuild/EPUGuild.toc
          mkdir -p dist
          zip -r "dist/EPUGuild-${VERSION}.zip" EPUGuild
          zip -r "dist/epu-discord-${VERSION}.zip" epu-discord -x "epu-discord/config.json" "epu-discord/state.json" "epu-discord/items.*"
          (cd updater && zip -r "../dist/EPU-Updater-${VERSION}.zip" .)
          # WowUp reads release.json to find the right zip (Install from URL with the repo link).
          # WowUp asks for flavor "forever" on a WoW: Forever install (BigWigs packager naming).
          cat > dist/release.json <<JSON
          {"releases":[{"name":"EPU Guild Tools","version":"${VERSION}","filename":"EPUGuild-${VERSION}.zip","nolib":false,
            "metadata":[{"flavor":"forever","interface":16001},{"flavor":"mainline","interface":16001}]}]}
          JSON
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/release.json
          tag_name: ${{ github.event.release.tag_name }}
      # Also publish to CurseForge, once the CF_API_KEY secret and the
      # CURSEFORGE_PROJECT_ID variable are set (Settings > Secrets and variables > Actions).
      - name: Upload to CurseForge
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
        run: |
          VERSION="${{ github.event.release.tag_name }}"; VERSION="${VERSION#v}"
          python tools/curseforge_upload.py "dist/EPUGuild-${VERSION}.zip" "${VERSION}" CHANGELOG.md
